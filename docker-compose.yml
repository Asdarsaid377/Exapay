# Environment development. Jalankan: docker compose up --build
# Variabel dibaca dari .env (salin dari .env.example).

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:8333
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+: mount di /var/lib/postgresql (bukan .../data)
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

  storage:
    # SeaweedFS (S3-compatible). Kredensial admin S3 dari env (mode dev).
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "8333:8333" # S3 API
    volumes:
      - storage-data:/data

  api:
    build: .
    command: pnpm --filter @exapay/api start
    env_file: .env
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${API_PORT:-4000}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: pnpm --filter @exapay/worker start
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: .
    command: pnpm --filter @exapay/web start
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:${API_PORT:-4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  storage-data:
