# Environment PRODUCTION (feature 38) — satu VPS. Panduan lengkap: docker/production/README.md
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Hanya Caddy yang membuka port ke host (80/443). Postgres, Redis, SeaweedFS, API, web: jaringan internal Docker.
# Setiap service hanya menerima env yang dibutuhkannya (bukan seluruh .env.production).

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-build: &build
  context: .
  dockerfile: docker/production/Dockerfile

services:
  caddy:
    image: caddy:2.10-alpine
    <<: [*restart, *logging]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/production/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  postgres:
    image: postgres:18-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    <<: [*restart, *logging]
    # AOF: job BullMQ (slip, AI, email) tidak hilang saat restart. noeviction: wajib untuk BullMQ.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      STORAGE_BACKUP_ACCESS_KEY_ID: ${STORAGE_BACKUP_ACCESS_KEY_ID:?}
      STORAGE_BACKUP_SECRET_ACCESS_KEY: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?}
    volumes:
      - ./docker/production/seaweedfs/start.sh:/start.sh:ro
      - storage-data:/data

  # One-shot: jalankan migration sebelum api/worker start (role app_owner)
  migrate:
    build:
      <<: *build
      target: migrate
    environment:
      # Juga dipakai skrip admin create-super-admin (lihat docker/production/README.md)
      DATABASE_MIGRATION_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      <<: *build
      target: api
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Caddy → api, atau Caddy → web → api: satu hop tepercaya (port api tidak terbuka ke host)
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      APP_WEB_URL: https://${APP_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?}
      # Tagihan langganan (feature 41): kosong → QR tidak ditampilkan
      QRIS_STATIC_PAYLOAD: ${QRIS_STATIC_PAYLOAD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    build:
      <<: *build
      target: worker
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5}
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      APP_WEB_URL: https://${APP_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?}
      COMPLIANCE_CRON: ${COMPLIANCE_CRON:-0 7 * * *}
      COMPLIANCE_CRON_TZ: ${COMPLIANCE_CRON_TZ:-Asia/Jakarta}
      BILLING_NOTICE_CRON: ${BILLING_NOTICE_CRON:-0 7 * * *}
      BILLING_NOTICE_CRON_TZ: ${BILLING_NOTICE_CRON_TZ:-Asia/Jakarta}
      BILLING_NOTIFY_EMAIL: ${BILLING_NOTIFY_EMAIL:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      <<: *build
      target: web
    <<: [*restart, *logging]
    environment:
      API_INTERNAL_URL: http://api:4000
      APP_WEB_URL: https://${APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/manifest.webmanifest > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Backup terjadwal → restic (terenkripsi) → S3 eksternal. Manual: docker compose … run --rm backup backup.sh
  backup:
    build:
      context: docker/production/backup
    <<: [*restart, *logging]
    environment:
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      STORAGE_S3_ENDPOINT: http://storage:8333
      STORAGE_S3_BUCKET: ${S3_BUCKET:?}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_BACKUP_ACCESS_KEY_ID:?}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - backup-staging:/staging
      - restic-cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
  backup-staging:
  restic-cache:
